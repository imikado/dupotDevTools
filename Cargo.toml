[package]
name = "dupot-dev-tools"
version = "2.2.0"
edition = "2024"
description = "The developer's Swiss Army knife for the Linux desktop"
license = "LGPL-2.1-only"
authors = ["Michael Bertocchi"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
sourceview5 = "0.11"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
base64 = "0.23"
percent-encoding = "2"
html-escape = "0.3"
html2text = "0.17"
sqlformat = "0.5"
quick-xml = "0.42"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
blake2 = "0.11"
csv = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v7"] }
ulid = "3"
regex = "1"
similar = "3"
croner = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
postgres = "0.19"
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
sqlparser = "0.63.0"
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ureq = "3"
ring = "0.17"
serde_json_path = "0.7"
sxd-document = "0.3"
sxd-xpath = "0.4"
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"

[profile.release]
lto = true
strip = true

# Quick builds to test a package (`build_windows_cross.sh --fast`): no fat
# LTO, which re-optimises every dependency at each link.
[profile.release-fast]
inherits = "release"
lto = false
incremental = true

[build-dependencies]
winresource = "0.1"
